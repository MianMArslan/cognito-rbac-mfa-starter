AWSTemplateFormatVersion: '2010-09-09'
Description: Root stack — deploys all nested stacks in dependency order

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  MfaConfiguration:
    Type: String
    Default: OPTIONAL
    AllowedValues: [OFF, OPTIONAL, ON]
  EnableSMSMfa:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  WebAppUrl:
    Type: String
    Description: Frontend URL (Amplify domain or custom domain)
    Default: 'http://localhost:3000'
  ApiImageUri:
    Type: String
    Description: ECR image URI for the NestJS API
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  GitHubRepo:
    Type: String
  GitHubBranch:
    Type: String
    Default: main
  GitHubAccessToken:
    Type: String
    NoEcho: true
  TemplatesBucketName:
    Type: String
    Description: S3 bucket where nested stack templates are uploaded

Resources:
  # 1. IAM roles (no dependencies)
  IAMStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplatesBucketName}.s3.${AWS::Region}.amazonaws.com/iam.yaml'
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        EnableSMSMfa: !Ref EnableSMSMfa

  # 2. ECR repository (no dependencies)
  ECRStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplatesBucketName}.s3.${AWS::Region}.amazonaws.com/ecr.yaml'
      Parameters:
        EnvironmentName: !Ref EnvironmentName

  # 3. Cognito (depends on IAM for SNS role)
  CognitoStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: IAMStack
    Properties:
      TemplateURL: !Sub 'https://${TemplatesBucketName}.s3.${AWS::Region}.amazonaws.com/cognito.yaml'
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        MfaConfiguration: !Ref MfaConfiguration
        EnableSMSMfa: !Ref EnableSMSMfa
        CognitoSNSRoleArn: !If
          - SMSMfaEnabled
          - !GetAtt IAMStack.Outputs.CognitoSNSRoleArn
          - ''
        WebAppUrl: !Ref WebAppUrl

  # 4. ECS (depends on IAM for task roles and Cognito for env vars)
  ECSStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: [IAMStack, CognitoStack]
    Properties:
      TemplateURL: !Sub 'https://${TemplatesBucketName}.s3.${AWS::Region}.amazonaws.com/ecs.yaml'
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        ApiImageUri: !Ref ApiImageUri
        VpcId: !Ref VpcId
        SubnetIds: !Join [',', !Ref SubnetIds]

  # 5. Amplify (depends on Cognito + ECS for env vars)
  AmplifyStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: [CognitoStack, ECSStack]
    Properties:
      TemplateURL: !Sub 'https://${TemplatesBucketName}.s3.${AWS::Region}.amazonaws.com/amplify.yaml'
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        GitHubRepo: !Ref GitHubRepo
        GitHubBranch: !Ref GitHubBranch
        GitHubAccessToken: !Ref GitHubAccessToken

Conditions:
  SMSMfaEnabled: !Equals [!Ref EnableSMSMfa, 'true']

Outputs:
  APIUrl:
    Value: !Sub 'http://${ECSStack.Outputs.ALBDnsName}'
  WebUrl:
    Value: !Sub 'https://${AmplifyStack.Outputs.AmplifyDefaultDomain}'
  UserPoolId:
    Value: !GetAtt CognitoStack.Outputs.UserPoolId
  UserPoolClientId:
    Value: !GetAtt CognitoStack.Outputs.UserPoolClientId

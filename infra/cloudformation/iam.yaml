AWSTemplateFormatVersion: '2010-09-09'
Description: IAM roles for Cognito SMS MFA and ECS

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [dev, staging, prod]
  EnableSMSMfa:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

Conditions:
  SMSMfaEnabled: !Equals [!Ref EnableSMSMfa, 'true']

Resources:
  # ── Cognito → SNS role for SMS MFA (conditional) ──────────────
  CognitoSNSRole:
    Type: AWS::IAM::Role
    Condition: SMSMfaEnabled
    Properties:
      RoleName: !Sub '${EnvironmentName}-cognito-sns-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cognito-idp.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Sub '${EnvironmentName}-cognito-sms'
      Policies:
        - PolicyName: CognitoSNSPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource: '*'

  # ── ECS task execution role (pull ECR images + write logs) ─────
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-ecs-task-execution-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # ── ECS task role (runtime permissions for NestJS) ─────────────
  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-ecs-task-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CognitoAdminPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminAddUserToGroup
                  - cognito-idp:AdminRemoveUserFromGroup
                  - cognito-idp:AdminListGroupsForUser
                  - cognito-idp:ListUsers
                Resource: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*'

Outputs:
  CognitoSNSRoleArn:
    Condition: SMSMfaEnabled
    Value: !GetAtt CognitoSNSRole.Arn
    Export:
      Name: !Sub '${EnvironmentName}-cognito-sns-role-arn'
  ECSTaskExecutionRoleArn:
    Value: !GetAtt ECSTaskExecutionRole.Arn
    Export:
      Name: !Sub '${EnvironmentName}-ecs-task-execution-role-arn'
  ECSTaskRoleArn:
    Value: !GetAtt ECSTaskRole.Arn
    Export:
      Name: !Sub '${EnvironmentName}-ecs-task-role-arn'

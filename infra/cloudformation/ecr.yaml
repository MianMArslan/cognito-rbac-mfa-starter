AWSTemplateFormatVersion: '2010-09-09'
Description: ECR repository for the NestJS API Docker image

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [dev, staging, prod]

Resources:
  ApiRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${EnvironmentName}-api'
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 10 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  RepositoryUri:
    Value: !GetAtt ApiRepository.RepositoryUri
    Export:
      Name: !Sub '${EnvironmentName}-api-repo-uri'
  RepositoryName:
    Value: !Ref ApiRepository
    Export:
      Name: !Sub '${EnvironmentName}-api-repo-name'
